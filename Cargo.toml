[package]
name = "rustle"
version = "0.4.4"
edition = "2024"
description = "A modern music player built with Rust and iced, supporting NetEase Cloud Music"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Fei-xiangShi/Rustle"
homepage = "https://github.com/Fei-xiangShi/Rustle"
readme = "README.md"
keywords = ["music", "player", "netease", "iced", "gui"]
categories = ["multimedia::audio"]

[dependencies]
iced = { version = "=0.15.0-dev", features = ["tokio", "advanced", "canvas", "image", "svg", "debug"] }
iced_runtime = { version = "=0.15.0-dev" }
iced_anim = "0.3.1"
bytemuck = { version = "1.25", features = ["derive"] }
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
rodio = { version = "0.21.1", features = ["symphonia-all"] }
spectrum-analyzer = "1.7.0"

sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
lofty = "0.22.4"
walkdir = "2.5.0"
directories = "6.0.0"

serde = "1.0.228"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.102"

# Local playlist import
rayon = "1.11.0"
encoding_rs = "0.8.35"
notify = { version = "8.2", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
interprocess = { version = "2", features = ["tokio"] }
rfd = "0.15.4"
async-stream = "0.3.6"
rand = "0.9"
cosmic-text = "0.15.0"
parking_lot = "0.12"

# SDF text rendering
ttf-parser = "0.25"
sdf_glyph_renderer = "1.0"
ab_glyph = "0.2"
quick-xml = "0.37.5"
futures-util = "0.3.32"
discord-rich-presence = "1.1.0"

# Netease Cloud Music API
ncm-api-rs = { git = "https://github.com/SPlayer-Dev/ncm-api-rs.git" }
qrcode-generator = "5.0"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "gzip", "stream"] }

regex = "1.12"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9.0"
ksni = { version = "0.3.3", default-features = false, features = ["tokio"] }

[patch.crates-io]
iced = { git = "https://github.com/Fei-xiangShi/iced.git", branch = "master" }
iced_runtime = { git = "https://github.com/Fei-xiangShi/iced.git", branch = "master" }
smithay-client-toolkit = { git = "https://github.com/Fei-xiangShi/client-toolkit.git", branch = "master" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["objc2-core-services"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21.3"
souvlaki = "0.8.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.30"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
